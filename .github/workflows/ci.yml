name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r typecheck
      - name: Unit tests
        shell: bash
        run: pnpm test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - run: node scripts/token-map.mjs --check
      - name: Contrast checks (writes packages/tokens/dist/verify.json)
        run: pnpm --filter @ghostjima/stoa-tokens verify
      - name: Chromium for the browser tests
        run: pnpm --filter playground exec playwright install --with-deps chromium
      - name: Browser tests (playground)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/playground-e2e.json
        run: pnpm --filter playground test:e2e --reporter=list,json
      - name: Storybook build
        run: pnpm build-storybook
      - name: Browser tests (stories, with the axe sweep over every story)
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/stories-e2e.json
        run: pnpm --filter @ghostjima/stoa-react test:stories --reporter=list,json
      # On a pull request the commits since its base are checked; on a push,
      # the last commit, unless it is the first one, which has no parent.
      - name: House style (emoji, attribution, internal paths)
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=()
          if [ "$EVENT_NAME" = pull_request ]; then
            base=("origin/$BASE_REF")
          elif git rev-parse -q --verify HEAD~1 > /dev/null; then
            base=(HEAD~1)
          fi
          node scripts/check-text.mjs "${base[@]}"
      # Every run builds the badges, so a value that can no longer be read
      # fails here, on the pull request; only main publishes them.
      - name: Badge values
        run: >-
          node scripts/badges.mjs --out "$RUNNER_TEMP/badges"
          --unit "$RUNNER_TEMP/unit.log"
          --browser "$RUNNER_TEMP/playground-e2e.json"
          --browser "$RUNNER_TEMP/stories-e2e.json"
          --verify packages/tokens/dist/verify.json
          --known packages/tokens/known-violations.json
          --css packages/react/dist/styles.css
          --css packages/tokens/dist/tokens.css
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badges
          path: ${{ runner.temp }}/badges
          if-no-files-found: error
          retention-days: 7

  # Commits the badge JSON to the orphan branch `badges`, which the README's
  # img.shields.io/endpoint badges read. Only after a green run on main.
  publish-badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-badges
      cancel-in-progress: false
    steps:
      # This job pushes to the badges branch, so it keeps the credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: badges
          path: ${{ runner.temp }}/badges
      - name: Commit to the badges branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="$RUNNER_TEMP/badges-branch"
          status=0
          git ls-remote --exit-code origin refs/heads/badges > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin badges
            git worktree add -B badges "$branch" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$branch"
            git -C "$branch" switch --orphan badges
          else
            exit "$status"
          fi
          find "$branch" -maxdepth 1 -name '*.json' -delete
          cp "$RUNNER_TEMP"/badges/*.json "$branch"/
          cd "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "The badges are unchanged."
            exit 0
          fi
          git commit -q -m "Badges measured on ${GITHUB_SHA}"
          git push origin HEAD:refs/heads/badges
